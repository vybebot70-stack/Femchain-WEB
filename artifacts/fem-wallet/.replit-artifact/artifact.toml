kind = "web"
previewPath = "/"
title = "FEM Ecosystem Website"
description = "An informational FEM website with Wallet, Chain, Swap and FEMScout product overviews, learning guides, and verified support details."
version = "1.0.0"
id = "artifacts/fem-wallet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25465

[services.development]
run = "pnpm --filter @workspace/fem-wallet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fem-wallet", "run", "build" ]
serve = "static"
publicDir = "artifacts/fem-wallet/out"


[services.env]
PORT = "25465"
BASE_PATH = "/"
